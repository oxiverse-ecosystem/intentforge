# SearXNG2 settings — Tor-optimized (speed over coverage)
# Only engines that actually work through Tor exit nodes.
# Brave: clearnet 429 through Tor exits, so we use brave-onion engine.
# DuckDuckGo WEB: uses custom onion engine pointing to the onion
# service at duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion
# DuckDuckGo images/videos: still use clearnet through Tor exit nodes

use_default_settings:
  engines:
    keep_only:
      # ── Tor-fast engines ──
      - brave           # clearnet works through Tor, ~0.5s
      - bing            # 10 results, ~1.5s
      - startpage       # 8 results, ~2s
      - mojeek          # 6 results, ~2s
      - wikipedia       # 1-2 results, ~1s
      # ── News (fast through Tor) ──
      - bing news
      - google news
      - hackernews
      # ── Images (multiple providers through Tor) ──
      - bing images
      - google images
      - duckduckgo images
      # ── Videos through Tor ──
      - bing videos
      - google videos
      - duckduckgo videos

server:
  port: 8081
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_searxng2_secret_key_987654321"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 120
    SearxEngineTimeout: 60
  default_lang: "en"

outgoing:
  request_timeout: 6.0     # raised from 4.0 — Tor circuits need more headroom
  max_request_timeout: 12.0 # raised from 8.0 — some Tor exits are slow
  # ALL traffic goes through Tor2 (port 9051)
  networks:
    default:
      proxies:
        all://: socks5h://127.0.0.1:9051
      using_tor_proxy: true
      retries: 1            # One retry through Tor — circuits can stall
    tor:
      proxies:
        all://: socks5h://127.0.0.1:9051
      using_tor_proxy: true
      retries: 1

engines:
  # ── Fast engines via Tor (higher timeouts for Tor latency) ──
  - name: bing
    disabled: false
    timeout: 5.0

  - name: startpage
    disabled: false
    timeout: 5.0

  # Brave clearnet through Tor is unreliable (429 rate-limited). Disable the
  # default clearnet instance and use the custom brave-onion engine instead.
  - name: brave
    disabled: true

  # Brave via onion service — consistently works through Tor (3-4s, ~20 results).
  - name: brave-onion
    engine: brave
    base_url: "https://search.brave4u7jddbv7cyviptqjc7jusxh72uik7zt6adtckl5f4nwy2v72qd.onion/"
    disabled: false
    shortcut: brv
    timeout: 8.0
    categories: general
    network: default

  # DDG via onion service — avoids CAPTCHA on Tor exit nodes
  - name: duckduckgo-onion
    engine: duckduckgo
    ddg_url: "https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion/html/"
    disabled: false
    shortcut: ddo
    timeout: 8.0
    categories: general
    network: default  # use the default network's SOCKS5 proxy for .onion

  - name: mojeek
    disabled: false
    timeout: 5.0

  - name: wikipedia
    disabled: false
    timeout: 4.0

  # ── Image engines via Tor (multiple for redundancy) ──
  - name: bing images
    engine: bing_images
    disabled: false
    timeout: 5.0

  - name: google images
    engine: google_images
    disabled: false
    timeout: 5.0

  - name: duckduckgo images
    engine: duckduckgo_extra
    ddg_category: images
    shortcut: ddi
    disabled: false
    timeout: 5.0

  # ── News via Tor ──
  - name: bing news
    engine: bing_news
    disabled: false
    timeout: 5.0

  - name: google news
    engine: google_news
    disabled: false
    timeout: 5.0

  - name: hackernews
    disabled: false
    timeout: 5.0

  # ── Video engines via Tor ──
  - name: bing videos
    engine: bing_videos
    disabled: false
    timeout: 5.0

  - name: google videos
    engine: google_videos
    disabled: false
    timeout: 5.0

  - name: duckduckgo videos
    engine: duckduckgo_extra
    ddg_category: videos
    shortcut: ddv
    disabled: false
    timeout: 5.0
