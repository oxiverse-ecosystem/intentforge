# SearXNG2 settings — Tor-optimized (speed over coverage)
# Only engines that actually work through Tor exit nodes.
# Blocked engines (brave, presearch, yandex) removed — they just
# waste 3-4s each timing out with CAPTCHA/access denied.

use_default_settings:
  engines:
    keep_only:
      # ── Proven fast through Tor ──
      - bing            # 10 results, ~1.5s
      - startpage       # 8 results, ~2s
      - duckduckgo      # 7 results, ~2.5s
      - mojeek          # 6 results, ~2s
      - wikipedia       # 1-2 results, ~1s
      # ── News (fast through Tor) ──
      - bing news
      - google news
      # ── Images (fast through Tor) ──
      - bing images

server:
  port: 8081
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_searxng2_secret_key_987654321"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 120
    SearxEngineTimeout: 60
  default_lang: "en"

outgoing:
  request_timeout: 2.5     # Tighter — we know which engines are fast
  max_request_timeout: 5.0
  # ALL traffic goes through Tor2 (port 9051)
  networks:
    default:
      proxies:
        all://: socks5h://127.0.0.1:9051
      using_tor_proxy: true
      retries: 0            # No retries through Tor — fail fast
    tor:
      proxies:
        all://: socks5h://127.0.0.1:9051
      using_tor_proxy: true
      retries: 0

engines:
  # ── Fast engines via Tor ──
  - name: bing
    disabled: false
    timeout: 3.0

  - name: startpage
    disabled: false
    timeout: 3.0

  - name: duckduckgo
    disabled: false
    timeout: 3.0

  - name: mojeek
    disabled: false
    timeout: 3.0

  - name: wikipedia
    disabled: false
    timeout: 2.5

  # ── Image & News via Tor ──
  - name: bing images
    engine: bing_images
    disabled: false
    timeout: 3.0

  - name: bing news
    engine: bing_news
    disabled: false
    timeout: 3.0

  - name: google news
    engine: google_news
    disabled: false
    timeout: 3.0
