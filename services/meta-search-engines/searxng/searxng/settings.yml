use_default_settings:
  engines:
    keep_only:
      # ── General web search ──
      - bing
      - brave
      - startpage
      - wikipedia
      - mojeek
      - marginalia
      # (removed duckduckgo + yandex: CAPTCHA'd/blocked through ProtonVPN 80%+ of the time)
      # ── Image engines (multiple providers for redundancy) ──
      - bing images
      - google images
      - duckduckgo images
      - brave images
      - openverse
      # ── News engines ──
      - bing news
      - google news
      - hackernews
      # ── Video engines ──
      - bing videos
      - google videos
      - duckduckgo videos

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_ultra_secret_key_123456789"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  # Auto-suspend engines on errors to avoid wasting time on retries.
  # SearXNG will re-enable them after the cooldown period.
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    SearxEngineTimeout: 0
  default_lang: "en"

outgoing:
  request_timeout: 4.0    # increased from 2.0s for slow VPN connections
  max_request_timeout: 8.0
  enable_http2: true       # HTTP/2 multiplexing for engines that support it
  pool_maxsize: 20         # increase per-host connection pool from default 10
  keepalive_expiry: 30     # keep idle connections alive longer (default 5s)
  # Per-network routing: Tor for .onion engines, default (VPN) for regular
  networks:
    default:
      # No proxy — traffic goes through gluetun VPN directly
      retries: 1
    tor:
      proxies:
        all://: socks5h://127.0.0.1:9050
      using_tor_proxy: true
      retries: 2

engines:
  # ── Primary engines (via VPN/Gluetun) ──
  - name: bing
    disabled: false
    timeout: 3.5

  - name: brave
    disabled: false
    timeout: 3.5

  - name: startpage
    disabled: false
    timeout: 3.5

  - name: wikipedia
    disabled: false
    timeout: 3.5

  - name: mojeek
    disabled: false
    timeout: 3.5

  - name: yandex
    disabled: true   # DISABLED: blocked through non-Russian VPN IPs, always times out
    timeout: 3.5

  # ── New engines (via VPN) ──
  - name: duckduckgo
    disabled: true   # DISABLED: CAPTCHA'd through ProtonVPN exit IPs 80%+ of the time
    timeout: 3.5

  - name: presearch
    disabled: true    # DISABLED: getting 403 rate-limited (suspended 300s), causes cascading timeouts
    timeout: 3.5

  - name: marginalia
    disabled: false
    timeout: 3.5

  # ── Onion engines (via Tor SOCKS5) ──
  - name: ahmia
    disabled: true    # DISABLED: searx.network.tor integration broken (Python httpx SOCKS5 issue)
    network: tor
    timeout: 20.0

  # ── Image engines (via VPN — multiple for redundancy) ──
  - name: bing images
    engine: bing_images
    disabled: false
    timeout: 3.5

  - name: google images
    engine: google_images
    disabled: false
    timeout: 3.5

  - name: duckduckgo images
    engine: duckduckgo_extra
    ddg_category: images
    shortcut: ddi
    disabled: false
    timeout: 3.5

  - name: brave images
    engine: brave
    brave_category: images
    categories: images
    shortcut: bri
    disabled: true    # DISABLED: brave changed response format, crashes SearXNG (ValueError: substring not found)
    timeout: 3.5

  - name: openverse
    engine: openverse
    shortcut: ovi
    disabled: false
    timeout: 3.5

  # ── News engines (via VPN) ──
  - name: bing news
    engine: bing_news
    disabled: false
    timeout: 3.0

  - name: google news
    engine: google_news
    disabled: false
    timeout: 3.0

  - name: hackernews
    disabled: false
    timeout: 3.0

  # ── Video engines (via VPN) ──
  - name: bing videos
    engine: bing_videos
    disabled: false
    timeout: 3.5

  - name: google videos
    engine: google_videos
    disabled: false
    timeout: 3.5

  - name: duckduckgo videos
    engine: duckduckgo_extra
    ddg_category: videos
    shortcut: ddv
    disabled: false
    timeout: 3.5
