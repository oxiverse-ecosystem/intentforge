use_default_settings:
  engines:
    keep_only:
      # ── General web search ──
      - bing
      - brave
      - wikipedia
      - marginalia
      # ── Academic / technical (serve site:arxiv.org directly, independent of
      # Brave). When Brave is rate-limited, instance1 still answers arxiv
      # queries via these engines instead of falling back to tor2. ──
      - arxiv
      - crossref
      # (removed duckduckgo + yandex + startpage + mojeek: blocked/CAPTCHA'd/403 through VPN)
      # ── Image engines (multiple providers for redundancy) ──
      - bing images
      - google images
      - duckduckgo images
      - openverse
      # ── News engines ──
      - bing news
      - google news
      - hackernews
      # ── Video engines ──
      - bing videos
      - google videos
      - duckduckgo videos
      # ── Shopping engines ──
      - google shopping
      - ebay

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_ultra_secret_key_123456789"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  # Auto-suspend engines with REAL backoff. Previously set to 0 ("gateway and
  # vpn-rotator handle IP rotation") — but the gateway only rotates on HTTP 429,
  # while engines actually fail with SearxEngineTooManyRequestsException served
  # as HTTP 200. With suspended_time=0 SearXNG hammered the same VPN IP every
  # query through the whole server-side suspension window (confirmed in logs:
  # brave/wikipedia "Too many request (suspended_time=0)" repeating every 1s).
  # Non-zero values let each instance self-heal: a rate-limited engine is skipped
  # for N seconds, so the gateway's fan-out leans on the other instance, and the
  # IP naturally cools. Complements (does not replace) gateway IP rotation.
  suspended_times:
    SearxEngineAccessDenied: 60
    SearxEngineCaptcha: 60
    SearxEngineTooManyRequests: 30
    SearxEngineTimeout: 10
  default_lang: "en"

outgoing:
  source_ips:
    - 0.0.0.0
  request_timeout: 8.0
  max_request_timeout: 12.0
  enable_http2: true       # HTTP/2 multiplexing for engines that support it
  pool_maxsize: 20         # increase per-host connection pool from default 10
  keepalive_expiry: 30     # keep idle connections alive longer (default 5s)
  # Per-network routing: Tor for .onion engines, default (VPN) for regular
  networks:
    default:
      # No proxy — traffic goes through gluetun VPN directly
      retries: 0
    tor:
      proxies:
        all://: socks5h://127.0.0.1:9050
      using_tor_proxy: false
      retries: 2

engines:
  # ── Primary engines (via VPN/Gluetun) ──
  - name: bing
    disabled: false
    timeout: 4.0

  - name: brave
    disabled: false
    timeout: 4.0

  - name: startpage
    disabled: true
    timeout: 1.0

  - name: wikipedia
    disabled: false
    timeout: 4.0

  - name: mojeek
    disabled: true
    timeout: 1.0

  - name: yandex
    disabled: true   # DISABLED: blocked through non-Russian VPN IPs, always times out
    timeout: 5.0

  # ── New engines (via VPN) ──
  - name: duckduckgo
    disabled: true   # DISABLED: CAPTCHA'd through ProtonVPN exit IPs 80%+ of the time
    timeout: 5.0

  - name: presearch
    disabled: true    # DISABLED: getting 403 rate-limited (suspended 300s), causes cascading timeouts
    timeout: 5.0

  - name: marginalia
    disabled: false
    timeout: 4.0

  # ── Academic engines (via VPN) ──
  - name: arxiv
    disabled: false
    categories: [science]  # not 'general': arxiv/crossref pollute every
                         # non-academic query with papers (see gateway
                         # ACADEMIC PAPER DEMOTE); gateway web searches
                         # use the general category only
    timeout: 4.0

  - name: crossref
    disabled: false
    categories: [science]  # not 'general': arxiv/crossref pollute every
                         # non-academic query with papers (see gateway
                         # ACADEMIC PAPER DEMOTE); gateway web searches
                         # use the general category only
    timeout: 4.0

  # ── Onion engines (via Tor SOCKS5) ──
  - name: ahmia
    disabled: true    # DISABLED: searx.network.tor integration broken (Python httpx SOCKS5 issue)
    network: tor
    timeout: 20.0

  # ── Image engines (via VPN — multiple for redundancy) ──
  - name: bing images
    engine: bing_images
    disabled: false
    timeout: 4.0

  - name: google images
    engine: google_images
    disabled: false
    timeout: 4.0

  - name: duckduckgo images
    engine: duckduckgo_extra
    ddg_category: images
    shortcut: ddi
    disabled: false
    timeout: 4.0

  - name: brave images
    engine: brave
    brave_category: images
    categories: images
    shortcut: bri
    disabled: true    # DISABLED: brave changed response format, crashes SearXNG (ValueError: substring not found)
    timeout: 5.0

  - name: openverse
    engine: openverse
    shortcut: ovi
    disabled: false
    timeout: 4.0

  # ── News engines (via VPN) ──
  - name: bing news
    engine: bing_news
    disabled: false
    timeout: 4.0

  - name: google news
    engine: google_news
    disabled: false
    timeout: 4.0

  - name: hackernews
    disabled: false
    timeout: 4.0
    categories: news

  # ── Video engines (via VPN) ──
  - name: bing videos
    engine: bing_videos
    disabled: false
    timeout: 4.0

  - name: google videos
    engine: google_videos
    disabled: false
    timeout: 4.0

  - name: duckduckgo videos
    engine: duckduckgo_extra
    ddg_category: videos
    shortcut: ddv
    disabled: false
    timeout: 4.0

  # ── Shopping engines (via VPN) ──
  - name: google shopping
    engine: google_shopping
    disabled: false
    timeout: 4.0

  - name: ebay
    engine: ebay
    disabled: false
    timeout: 4.0
