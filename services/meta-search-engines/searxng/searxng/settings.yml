use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - startpage
      - wikipedia
      - mojeek
      - yandex

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_ultra_secret_key_123456789"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  # Don't suspend engines on errors — we handle rotation ourselves
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    SearxEngineTimeout: 0
  default_lang: "en"

outgoing:
  max_request_timeout: 8.0

engines:
  # Primary engines (active)
  - name: bing
    disabled: false
    timeout: 7.0

  - name: brave
    disabled: false
    timeout: 6.0

  - name: startpage
    disabled: false
    timeout: 5.5

  # Reference engines
  - name: wikipedia
    disabled: false
    timeout: 3.0

  # Additional engines for broader recall
  - name: mojeek
    disabled: false
    timeout: 6.0

  - name: yandex
    disabled: false
    timeout: 6.0

  # Disabled engines are excluded by keep_only above — no need to list them here.
  # If you want to re-enable an engine, add it to keep_only AND add its config below.
