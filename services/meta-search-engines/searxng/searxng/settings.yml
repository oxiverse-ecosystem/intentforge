use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_ultra_secret_key_123456789"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  # Don't suspend engines on errors — we handle rotation ourselves
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    SearxEngineTimeout: 0

outgoing:
  max_request_timeout: 4.5

engines:
  # Disabled — too CAPTCHA-prone via SearXNG
  - name: google
    disabled: true

  # Primary engines (active)
  - name: bing
    disabled: false
    timeout: 4.0

  - name: brave
    disabled: false
    timeout: 2.5

  # Secondary engines (re-enable for rotation)
  - name: duckduckgo
    disabled: false
    timeout: 3.0

  - name: qwant
    disabled: false
    timeout: 3.0

  - name: startpage
    disabled: false
    timeout: 3.5

  # Reference engines (always useful)
  - name: wikipedia
    disabled: false
    timeout: 2.0

  - name: wikidata
    disabled: false
    timeout: 2.0

  # Tor-only engines (disabled for VPN path)
  - name: ahmia
    disabled: true

  - name: torch
    disabled: true
