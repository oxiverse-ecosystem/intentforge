use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - startpage
      - wikipedia
      - mojeek
      - yandex
      - duckduckgo
      - ahmia
      - presearch
      - marginalia

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_ultra_secret_key_123456789"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  # Don't suspend engines on errors — we handle rotation ourselves
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    SearxEngineTimeout: 0
  default_lang: "en"

outgoing:
  max_request_timeout: 12.0  # increased for Tor latency
  # Per-network routing: Tor for .onion engines, default (VPN) for regular
  networks:
    tor:
      proxies:
        all://: socks5h://127.0.0.1:9050
      using_tor_proxy: true
      extra_proxy_timeout: 15
      request_timeout: 15.0
      retries: 2

engines:
  # ── Primary engines (via VPN/Gluetun) ──
  - name: bing
    disabled: false
    timeout: 7.0

  - name: brave
    disabled: false
    timeout: 6.0

  - name: startpage
    disabled: false
    timeout: 5.5

  - name: wikipedia
    disabled: false
    timeout: 3.0

  - name: mojeek
    disabled: false
    timeout: 6.0

  - name: yandex
    disabled: false
    timeout: 6.0

  # ── New engines (via VPN) ──
  - name: duckduckgo
    disabled: false
    timeout: 6.0

  - name: presearch
    disabled: false
    timeout: 6.0

  - name: marginalia
    disabled: false
    timeout: 8.0

  # ── Onion engines (via Tor SOCKS5) ──
  - name: ahmia
    disabled: false
    network: tor
    timeout: 20.0
