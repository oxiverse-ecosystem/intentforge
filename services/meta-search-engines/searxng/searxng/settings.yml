use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - startpage
      - wikipedia
      - mojeek
      - yandex
      - duckduckgo
      - ahmia
      - presearch
      - marginalia
      - bing images
      - bing news
      - google news

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_ultra_secret_key_123456789"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  # Auto-suspend engines on errors to avoid wasting time on retries.
  # SearXNG will re-enable them after the cooldown period.
  suspended_times:
    SearxEngineAccessDenied: 300   # 5 min cooldown for access denied
    SearxEngineCaptcha: 600        # 10 min cooldown for CAPTCHA
    SearxEngineTooManyRequests: 120 # 2 min cooldown for rate limits
    SearxEngineTimeout: 60         # 1 min cooldown for timeouts
  default_lang: "en"

outgoing:
  request_timeout: 3.0  # raised from 2.5s to give fast engines (bing, brave) more room
  max_request_timeout: 5.0
  # Per-network routing: Tor for .onion engines, default (VPN) for regular
  networks:
    tor:
      proxies:
        all://: socks5h://127.0.0.1:9050
      using_tor_proxy: true
      retries: 2

engines:
  # ── Primary engines (via VPN/Gluetun) ──
  - name: bing
    disabled: false
    timeout: 3.0

  - name: brave
    disabled: false
    timeout: 2.5

  - name: startpage
    disabled: false
    timeout: 2.5

  - name: wikipedia
    disabled: false
    timeout: 2.0

  - name: mojeek
    disabled: false
    timeout: 2.0    # lowered from 2.5s — often blocked, fail fast to let faster engines win

  - name: yandex
    disabled: false
    timeout: 2.0    # lowered from 2.5s — often CAPTCHA'd, fail fast to let faster engines win

  # ── New engines (via VPN) ──
  - name: duckduckgo
    disabled: false
    timeout: 2.5

  - name: presearch
    disabled: false
    timeout: 3.0

  - name: marginalia
    disabled: false
    timeout: 3.0

  # ── Onion engines (via Tor SOCKS5) ──
  - name: ahmia
    disabled: false
    network: tor
    timeout: 20.0

  # ── Image & News engines (via VPN/Gluetun) ──
  - name: bing images
    engine: bing_images
    disabled: false
    timeout: 3.0

  - name: bing news
    engine: bing_news
    disabled: false
    timeout: 3.0

  - name: google news
    engine: google_news
    disabled: false
    timeout: 3.0
