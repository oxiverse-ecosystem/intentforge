use_default_settings:
  engines:
    keep_only:
      # ── General web search ──
      - bing
      - brave
      - startpage
      - wikipedia
      - mojeek
      - yandex
      - duckduckgo
      - ahmia
      - presearch
      - marginalia
      # ── Image engines (multiple providers for redundancy) ──
      - bing images
      - google images
      - duckduckgo images
      - brave images
      - openverse
      # ── News engines ──
      - bing news
      - google news
      - hackernews
      # ── Video engines ──
      - bing videos
      - google videos
      - duckduckgo videos

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "intentforge_v2_ultra_secret_key_123456789"

search:
  safe_search: 0
  autocomplete: "google"
  formats:
    - html
    - json
  # Auto-suspend engines on errors to avoid wasting time on retries.
  # SearXNG will re-enable them after the cooldown period.
  suspended_times:
    SearxEngineAccessDenied: 300   # 5 min cooldown for access denied
    SearxEngineCaptcha: 600        # 10 min cooldown for CAPTCHA
    SearxEngineTooManyRequests: 120 # 2 min cooldown for rate limits
    SearxEngineTimeout: 60         # 1 min cooldown for timeouts
  default_lang: "en"

outgoing:
  request_timeout: 3.0    # raised from 2.5s — give engines more room
  max_request_timeout: 6.0
  # Per-network routing: Tor for .onion engines, default (VPN) for regular
  networks:
    default:
      # No proxy — traffic goes through gluetun VPN directly
      retries: 1
    tor:
      proxies:
        all://: socks5h://127.0.0.1:9050
      using_tor_proxy: true
      retries: 2

engines:
  # ── Primary engines (via VPN/Gluetun) ──
  - name: bing
    disabled: false
    timeout: 3.0

  - name: brave
    disabled: false
    timeout: 3.0

  - name: startpage
    disabled: false
    timeout: 3.0

  - name: wikipedia
    disabled: false
    timeout: 2.0

  - name: mojeek
    disabled: false
    timeout: 2.5

  - name: yandex
    disabled: false
    timeout: 2.5

  # ── New engines (via VPN) ──
  - name: duckduckgo
    disabled: false
    timeout: 3.0

  - name: presearch
    disabled: true    # DISABLED: getting 403 rate-limited (suspended 300s), causes cascading timeouts
    timeout: 2.0

  - name: marginalia
    disabled: false
    timeout: 2.5

  # ── Onion engines (via Tor SOCKS5) ──
  - name: ahmia
    disabled: true    # DISABLED: searx.network.tor integration broken (Python httpx SOCKS5 issue)
    network: tor
    timeout: 20.0

  # ── Image engines (via VPN — multiple for redundancy) ──
  - name: bing images
    engine: bing_images
    disabled: false
    timeout: 3.5

  - name: google images
    engine: google_images
    disabled: false
    timeout: 3.5

  - name: duckduckgo images
    engine: duckduckgo_extra
    ddg_category: images
    shortcut: ddi
    disabled: false
    timeout: 3.5

  - name: brave images
    engine: brave
    brave_category: images
    categories: images
    shortcut: bri
    disabled: false
    timeout: 3.5

  - name: openverse
    engine: openverse
    shortcut: ovi
    disabled: false
    timeout: 3.5

  # ── News engines (via VPN) ──
  - name: bing news
    engine: bing_news
    disabled: false
    timeout: 3.0

  - name: google news
    engine: google_news
    disabled: false
    timeout: 3.0

  - name: hackernews
    disabled: false
    timeout: 3.0

  # ── Video engines (via VPN) ──
  - name: bing videos
    engine: bing_videos
    disabled: false
    timeout: 3.5

  - name: google videos
    engine: google_videos
    disabled: false
    timeout: 3.5

  - name: duckduckgo videos
    engine: duckduckgo_extra
    ddg_category: videos
    shortcut: ddv
    disabled: false
    timeout: 3.5
