services:
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    network_mode: "container:gluetun"
    environment:
      - GRANIAN_WORKERS=4
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── SearXNG2 via Tor (tor2, port 9051) — parallel search path ──
  # All engines route through Tor for a different IP than the VPN path.
  # Gateway round-robins queries across both SearXNG instances.
  searxng2:
    container_name: searxng2
    build:
      context: .
      dockerfile: Dockerfile.searxng2
    network_mode: "container:gluetun"
    environment:
      - GRANIAN_WORKERS=4
      - SEARXNG_PORT=8081
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./searxng2:/etc/searxng:ro
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
