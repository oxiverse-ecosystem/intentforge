global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# Frontend for SOCKS5 requests from SearXNG
frontend socks_in
    bind *:1080
    default_backend socks_out

# Backend that tries Tor first, then falls back to Direct (VPN)
backend socks_out
    # Tor Proxy (SOCKS5)
    server tor 127.0.0.1:9050 check inter 2000 rise 2 fall 3
    
    # Fallback to Direct (since HAProxy is in Gluetun network, 'direct' is VPN)
    # HAProxy doesn't easily 'bypass' itself for SOCKS5, 
    # but we can use a second SOCKS proxy or just rely on SearXNG 
    # to handle the failure if we don't have a secondary SOCKS proxy.
    
    # Actually, SearXNG needs a SOCKS5 proxy if configured for one.
    # If Tor is down, HAProxy could route to another SOCKS5 proxy like Shadowsocks.
    # Since Gluetun HAS Shadowsocks enabled, we use that as fallback!
    server backup_vpn 127.0.0.1:8388 backup
