services:
  gluetun:
    image: qmcgaw/gluetun:v3.39.0
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ../../.env
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - FREE_ONLY=on
      - OPENVPN_USER=${OPENVPN_USERNAME}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - DNS_KEEP_NAMESERVERS=on
      - HTTP_PROXY=on
      - SHADOWSOCKS=on
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE=public
    ports:
      - "8888:8888/tcp" # HTTP Proxy
      - "8388:8388/tcp" # Shadowsocks
      - "8080:8080"     # SearXNG (Routed)
      - "5000:5000"     # Whoogle (Routed)
      - "3000:3000"     # Invidious (Routed)
      - "4000:4000"     # Gateway (Routed)
      - "6000:6000"     # Indexer (Routed)
      # - "1080:1080"     # HAProxy (Tor/VPN Fallback) — disabled, Tor not active
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vpn-rotator:
    image: alpine:latest
    container_name: vpn-rotator
    command: >
      sh -c "apk add --no-cache curl &&
      echo 'VPN rotator started — rotating every 2 hours' &&
      while true; do
        sleep 7200;
        echo \"$$(date -u) Rotating VPN IP...\";
        curl -s -m 10 -X PUT -d '{\"status\":\"stopped\"}' http://127.0.0.1:8000/v1/vpn/status;
        sleep 5;
        curl -s -m 10 -X PUT -d '{\"status\":\"running\"}' http://127.0.0.1:8000/v1/vpn/status;
        sleep 10;
        IP=$$(curl -s -m 10 http://127.0.0.1:8000/v1/publicip/ip 2>/dev/null || echo 'unknown');
        echo \"$$(date -u) VPN rotated. New IP: $$IP\";
      done"
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    restart: always

