services:
  gluetun:
    image: qmcgaw/gluetun:v3.39.0
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ../../.env
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - FREE_ONLY=on
      - OPENVPN_USER=${OPENVPN_USERNAME}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - DNS_KEEP_NAMESERVERS=on
      - HTTP_PROXY=on
      - SHADOWSOCKS=on
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE=public
    ports:
      - "8888:8888/tcp" # HTTP Proxy
      - "8388:8388/tcp" # Shadowsocks
      - "8080:8080"     # SearXNG (via VPN)
      - "8081:8081"     # SearXNG2 (via Tor — parallel path)
      - "5000:5000"     # Whoogle (Routed)
      - "3000:3000"     # Invidious (Routed)
      - "4000:4000"     # Gateway (Routed)
      - "80:80"         # Traefik HTTP (ACME challenge + redirect)
      - "443:443"       # Traefik HTTPS (api.oxiverse.com)
      - "6000:6000"     # Indexer (Routed)
    restart: always
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vpn-rotator:
    image: alpine:latest
    container_name: vpn-rotator
    volumes:
      - ./vpn-rotator.sh:/vpn-rotator.sh:ro
      - ../shared-signals:/tmp/vpn-signals
    command: ["sh", "/vpn-rotator.sh"]
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    restart: always

  tor:
    build: ./tor
    container_name: tor
    network_mode: "service:gluetun"
    volumes:
      - ./tor/data:/var/lib/tor
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Second Tor instance for parallel SearXNG2 throughput ──
  # SearXNG2 routes all queries through this Tor (port 9051).
  # SearXNG1 uses VPN (gluetun). Both run in parallel.
  # Tor provides a completely different IP path — true parallelism.
  tor2:
    build: ./tor2
    container_name: tor2
    network_mode: "service:gluetun"
    volumes:
      - ./tor2/data:/var/lib/tor
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
