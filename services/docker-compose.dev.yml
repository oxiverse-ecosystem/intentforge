# IntentForge v2 — DEVELOPMENT Compose
# Full stack MINUS Traefik. VPN + Tor + all search engines included.
# Gateway exposed directly on localhost:4000 (no SSL proxy).
# Difference from prod: no Traefik, no ports 80/443, fewer workers.

services:
  # ══════════════════════════════════════════════════════════════════
  # PRIVACY LAYER — VPN + Tor
  # ══════════════════════════════════════════════════════════════════

  gluetun:
    image: qmcgaw/gluetun:v3.39.0
    container_name: if-dev-gluetun
    mem_limit: 512m
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ../.env
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - FREE_ONLY=on
      - DNS_ADDRESS=1.1.1.1
      - HTTP_PROXY=on
      - SHADOWSOCKS=on
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE=public
      - OPENVPN_OPTIONS=--route-nopull
      # Allow the gateway (which shares this netns) to reach the OTHER egress
      # path (tor2 / SearXNG2 on the docker bridge) WITHOUT tunnelling it
      # through the VPN. Without this, gluetun's kill-switch firewall blocks
      # all non-VPN outbound, so the gateway can reach only loopback services
      # (searxng/intent/indexer) and never tor2 — collapsing the "two
      # independent paths" fallback to a single dead-end whenever tor2 is the
      # one that's up. 172.19.0.0/16 is the services_default bridge subnet.
      - FIREWALL_OUTBOUND_SUBNETS=172.19.0.0/16
    # ──────────────────────────────────────────────────────────────────
    # Service names for everything that shares THIS container's network
    # namespace (`network_mode: "service:gluetun"`).
    #
    # Docker's embedded DNS (127.0.0.11) only publishes A records for
    # containers that OWN a network attachment.  A service that borrows
    # gluetun's namespace therefore gets no DNS record of its own, so
    # `getent hosts searxng|intent-engine|crawler|indexer` failed from
    # inside the gateway even though every one of those services is healthy
    # and listening on 0.0.0.0 in this very namespace (the gateway env
    # addressed them as http://localhost:<port> for exactly that reason).
    #
    # Fix: register the names on the network gluetun DOES own.  Each alias
    # resolves to gluetun's own bridge IP, and because the target process
    # binds 0.0.0.0 inside this namespace, name:port connects for real — no
    # /etc/hosts hack, no static IP (the bridge subnet is assigned at
    # `docker network create` time), and no change to the app's own URLs.
    #   searxng2 is the mirror image of this on tor2 (see the tor2 service).
    networks:
      default:
        aliases:
          - searxng
          - intent-engine
          - crawler
          - indexer
          - tor
    ports:
      - "18888:8888/tcp"
      - "8388:8388/tcp"
      - "8080:8080"
      - "5000:5000"
      - "3000:3000"
      - "4000:4000"
      - "6000:6000"
    restart: always
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 20s
      timeout: 8s
      start_period: 45s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vpn-rotator:
    image: alpine:latest
    container_name: if-dev-vpn-rotator
    mem_limit: 64m
    volumes:
      - ./privacy-layer/vpn-rotator.sh:/vpn-rotator.sh:ro
      - ./shared-signals:/tmp/vpn-signals
      - ./shared-signals/resolv-gluetun.conf:/etc/resolv.conf:ro
    command: ["sh", "/vpn-rotator.sh"]
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    restart: always

  tor:
    build: ./privacy-layer/tor
    container_name: if-dev-tor
    mem_limit: 256m
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    volumes:
      - ./privacy-layer/tor/data:/var/lib/tor
      - ./shared-signals/resolv-gluetun.conf:/etc/resolv.conf:ro
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tor2:
    build: ./privacy-layer/tor2
    container_name: if-dev-tor2
    mem_limit: 256m
    # Independent network — NOT behind gluetun VPN
    # Tor2 provides a separate IP path for SearXNG2
    ports:
      - "19051:9051"
      - "8081:8081"    # SearXNG2 accessible via tor2's network
    volumes:
      - ./privacy-layer/tor2/data:/var/lib/tor
    # Mirror of the gluetun alias block: searxng2 borrows tor2's network
    # namespace, so it has no DNS record of its own.  Registering the name on
    # the network tor2 owns makes searxng2:8081 resolve and connect from the
    # gateway (searxng2 listens on 0.0.0.0:8081 in that namespace).
    networks:
      default:
        aliases:
          - searxng2
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════
  # META-SEARCH ENGINES
  # ══════════════════════════════════════════════════════════════════

  searxng:
    container_name: if-dev-searxng
    mem_limit: 1536m
    image: searxng/searxng:latest
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      tor:
        condition: service_started
    environment:
      - GRANIAN_WORKERS=4
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./meta-search-engines/searxng/searxng:/etc/searxng:rw
      - ./shared-signals/resolv-searxng-host.conf:/etc/resolv.conf:ro
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  searxng2:
    container_name: if-dev-searxng2
    mem_limit: 1024m
    build:
      context: ./meta-search-engines/searxng
      dockerfile: Dockerfile.searxng2
    network_mode: "service:tor2"    # Routes through Tor2 (independent of gluetun VPN)
    depends_on:
      - tor2
    environment:
      - GRANIAN_WORKERS=4
      - SEARXNG_PORT=8081
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./meta-search-engines/searxng/searxng2:/etc/searxng:rw
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  invidious-db:
    container_name: if-dev-invidious-db
    mem_limit: 512m
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_DB=invidious
      - POSTGRES_USER=kemal
      - POSTGRES_PASSWORD=kemal
    volumes:
      - invidious-db-data-dev:/var/lib/postgresql/data

  invidious:
    container_name: if-dev-invidious
    mem_limit: 512m
    image: quay.io/invidious/invidious:latest
    depends_on:
      - invidious-db
    environment:
      - INVIDIOUS_DATABASE_URL=postgres://kemal:kemal@invidious-db:5432/invidious
      - INVIDIOUS_HMAC_KEY=intentforge_v2_invidious_hmac_key_987654321
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════
  # INDEXER + CRAWLER
  # ══════════════════════════════════════════════════════════════════

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    container_name: if-dev-indexer
    mem_limit: 2048m
    mem_reservation: 512m
    # CPU was previously UNBOUNDED (no cpus: on any service). Measured
    # 2026-09-25: indexer sustained 31-58% of a core. It is a batch worker,
    # not latency-critical, so cap it at 1 core.
    cpus: "1.0"
    volumes:
      - ./indexer/index_data:/app/index_data
      - ./shared-signals/resolv-gluetun.conf:/etc/resolv.conf:ro
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: if-dev-crawler
    # Lowered 2048m -> 1536m: measured 1.20-1.44 GiB steady, i.e. sitting
    # right against the old 2GB ceiling. 1536m keeps headroom without OOM.
    mem_limit: 1536m
    mem_reservation: 512m
    # CPU was previously UNBOUNDED. Measured 2026-09-25: crawler swung
    # 17-98% of a core. Batch worker, not latency-critical -> cap at 1 core.
    cpus: "1.0"
    environment:
      # crawler=debug surfaces the per-page "Content length: raw= truncated= cap="
      # line used for raw-length distribution measurement (cap tuning).
      - RUST_LOG=info,crawler=debug
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ./shared-signals/resolv-gluetun.conf:/etc/resolv.conf:ro
      - ./crawler/queue_data:/app/queue_data
    restart: always

  # ══════════════════════════════════════════════════════════════════
  # INTENT ENGINE + GATEWAY
  # ══════════════════════════════════════════════════════════════════

  intent-engine:
    build:
      context: ./intent-engine
      dockerfile: Dockerfile
    container_name: if-dev-intent-engine
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - ./intent-engine/models:/app/models
      - ./shared-signals/resolv-gluetun.conf:/etc/resolv.conf:ro
    environment:
      - RUST_LOG=info
      - RAYON_NUM_THREADS=4
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always

  geolite2-updater:
      build:
        context: ./geolite2-updater
        dockerfile: Dockerfile
      container_name: if-dev-geolite2-updater
      env_file:
        - ../.env
      environment:
        - GATEWAY_CONTAINER_NAME=if-dev-gateway
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - geolite2-data:/data
      restart: always

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: if-dev-gateway
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - INTENT_ENGINE_URL=http://localhost:3005
      - SEARXNG_URL=http://localhost:8080
      - SEARXNG2_URL=http://tor2:8081
      - CRAWLER_URL=http://localhost:5001
      - INDEXER_URL=http://localhost:6000
      # Affiliate network keys (ROADMAP item 3). Absent => /shopping degrades to
      # `affiliate: null` (graceful). Set a value here only to exercise the path
      # locally; NEVER commit real keys. Production keys come from the runtime env.
      - SOVRN_COMMERCE_KEY=dummy-test-key-do-not-use
    volumes:
      - ./shared-signals:/tmp/vpn-signals
      - ./shared-signals/resolv-gateway.conf:/etc/resolv.conf:ro
      - ../data/geolite2:/var/lib/geolite2:ro
      - ./gateway/data/commerce:/app/data/commerce:ro
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      intent-engine:
        condition: service_started
      crawler:
        condition: service_started
      indexer:
        condition: service_started
      searxng:
        condition: service_started
      searxng2:
        condition: service_started
      invidious:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: always

volumes:
  invidious-db-data-dev:
  geolite2-data:
