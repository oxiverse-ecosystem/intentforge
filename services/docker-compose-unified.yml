# IntentForge v2 — Unified Docker Compose
# All services in one file. All share gluetun's network namespace.
# Usage: cd services && docker compose -f docker-compose-unified.yml up -d
#
# Architecture:
#   gluetun (VPN) -> shared network namespace for ALL services
#   tor (9050) -> Socks5 for .onion engines in SearXNG1
#   tor2 (9051) -> Socks5 for ALL SearXNG2 traffic (different IP path)
#   searxng (8080) -> Web search via VPN (bing, brave, startpage, etc.)
#   searxng2 (8081) -> Web search via Tor2 (parallel throughput)
#   whoogle (5000) -> Google proxy
#   invidious (3000) -> YouTube proxy (video search)
#   indexer (6000) -> Local BM25 index
#   crawler (5001) -> Page fetcher for local index
#   intent-engine (3005) -> Embedding + intent analysis
#   gateway (4000) -> Main API (fan-out to all search backends)
#   traefik (80/443) -> Reverse proxy with auto SSL
#   vpn-rotator -> VPN health monitor

services:
  # ══════════════════════════════════════════════════════════════════
  # PRIVACY LAYER — VPN + Tor
  # ══════════════════════════════════════════════════════════════════

  gluetun:
    image: qmcgaw/gluetun:v3.39.0
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ../.env
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - FREE_ONLY=on
      - DNS_ADDRESS=1.1.1.1
      - HTTP_PROXY=on
      - SHADOWSOCKS=on
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE=public
    ports:
      - "8888:8888/tcp"
      - "8388:8388/tcp"
      - "8080:8080"
      - "8081:8081"
      - "5000:5000"
      - "3000:3000"
      - "4000:4000"
      - "6000:6000"
      - "80:80"
      - "443:443"
    restart: always
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vpn-rotator:
    image: alpine:latest
    container_name: vpn-rotator
    volumes:
      - ./privacy-layer/vpn-rotator.sh:/vpn-rotator.sh:ro
      - ./shared-signals:/tmp/vpn-signals
    command: ["sh", "/vpn-rotator.sh"]
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    restart: always

  tor:
    build: ./privacy-layer/tor
    container_name: tor
    network_mode: "service:gluetun"
    volumes:
      - ./privacy-layer/tor/data:/var/lib/tor
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tor2:
    build: ./privacy-layer/tor2
    container_name: tor2
    network_mode: "service:gluetun"
    volumes:
      - ./privacy-layer/tor2/data:/var/lib/tor
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════
  # META-SEARCH ENGINES
  # ══════════════════════════════════════════════════════════════════

  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    network_mode: "service:gluetun"
    environment:
      - GRANIAN_WORKERS=4
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./meta-search-engines/searxng/searxng:/etc/searxng:rw
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  searxng2:
    container_name: searxng2
    image: searxng/searxng:latest
    network_mode: "service:gluetun"
    environment:
      - GRANIAN_WORKERS=4
      - SEARXNG_PORT=8081
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./meta-search-engines/searxng/searxng2:/etc/searxng:rw
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  whoogle:
    container_name: whoogle
    image: benbusby/whoogle-search:latest
    network_mode: "service:gluetun"
    restart: always
    environment:
      - WHOOGLE_CONFIG_HTTPS=0
      - WHOOGLE_CONFIG_THEME=dark
      - WHOOGLE_CONFIG_SEARCH_LANGUAGE=lang_en
      - WHOOGLE_CONFIG_USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  invidious-db:
    container_name: invidious-db
    image: postgres:14-alpine
    network_mode: "service:gluetun"
    restart: always
    environment:
      - POSTGRES_DB=invidious
      - POSTGRES_USER=kemal
      - POSTGRES_PASSWORD=kemal
    volumes:
      - invidious-db-data:/var/lib/postgresql/data

  invidious:
    container_name: invidious
    image: quay.io/invidious/invidious:latest
    network_mode: "service:gluetun"
    depends_on:
      - invidious-db
    environment:
      - INVIDIOUS_DATABASE_URL=postgres://kemal:kemal@localhost:5432/invidious
      - INVIDIOUS_HMAC_KEY=intentforge_v2_invidious_hmac_key_987654321
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════
  # INDEXER + CRAWLER (local search index)
  # ══════════════════════════════════════════════════════════════════

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    container_name: indexer
    volumes:
      - ./indexer/index_data:/app/index_data
    network_mode: "service:gluetun"
    restart: always

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: crawler
    network_mode: "service:gluetun"
    restart: always

  # ══════════════════════════════════════════════════════════════════
  # INTENT ENGINE + GATEWAY
  # ══════════════════════════════════════════════════════════════════

  intent-engine:
    build:
      context: ./intent-engine
      dockerfile: Dockerfile
    container_name: intent-engine
    volumes:
      - ./intent-engine/models:/app/models
    environment:
      - RUST_LOG=info
      - RAYON_NUM_THREADS=4
    network_mode: "service:gluetun"
    restart: always

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    environment:
      - INTENT_ENGINE_URL=http://localhost:3005
      - SEARXNG_URL=http://localhost:8080
      - SEARXNG2_URL=http://localhost:8081
      - CRAWLER_URL=http://localhost:5001
      - INDEXER_URL=http://localhost:6000
    volumes:
      - ./shared-signals:/tmp/vpn-signals
    network_mode: "service:gluetun"
    depends_on:
      - intent-engine
      - crawler
      - indexer
      - searxng
      - searxng2
      - whoogle
      - invidious
    restart: always

  # ══════════════════════════════════════════════════════════════════
  # REVERSE PROXY (Traefik — auto SSL)
  # ══════════════════════════════════════════════════════════════════

  traefik:
    image: traefik:v3.1
    container_name: traefik
    network_mode: "service:gluetun"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme:/etc/traefik/acme
    depends_on:
      - gluetun
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  invidious-db-data:
