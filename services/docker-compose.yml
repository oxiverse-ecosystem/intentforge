services:
  intent-engine:
    build: 
      context: ./intent-engine
      dockerfile: Dockerfile
    container_name: intent-engine
    volumes:
      - ./intent-engine/models:/app/models
    environment:
      - RUST_LOG=info
      - RAYON_NUM_THREADS=4
    network_mode: "container:gluetun"
    restart: always

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    environment:
      - INTENT_ENGINE_URL=http://localhost:3005
      - SEARXNG_URL=http://localhost:8080
      - SEARXNG2_URL=http://localhost:8081
      - CRAWLER_URL=http://localhost:5001
      - INDEXER_URL=http://localhost:6000
    volumes:
      - ../shared-signals:/tmp/vpn-signals
    network_mode: "container:gluetun"
    depends_on:
      - intent-engine
      - crawler
    restart: always

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: crawler
    network_mode: "container:gluetun"
    restart: always

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    container_name: indexer
    volumes:
      - ./indexer/index_data:/app/index_data
    network_mode: "container:gluetun"
    restart: always
