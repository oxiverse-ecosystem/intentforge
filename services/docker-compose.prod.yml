# IntentForge v2 — PRODUCTION Compose
# Full stack: VPN + Tor + SearXNG + Traefik + SSL
#
# Usage (from project root):
#   make prod-up          # build + start
#   make prod-down        # stop
#   make prod-nuke        # stop + delete everything
#   make prod-logs        # tail logs
#
# Manual (from services/ dir):
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down

services:
  # ══════════════════════════════════════════════════════════════════
  # PRIVACY LAYER — VPN + Tor
  # ══════════════════════════════════════════════════════════════════

  gluetun:
    image: qmcgaw/gluetun:v3.39.0
    container_name: if-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ../.env
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - FREE_ONLY=on
      - DNS_ADDRESS=1.1.1.1
      - HTTP_PROXY=on
      - SHADOWSOCKS=on
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE=public
    ports:
      - "8888:8888/tcp"
      - "8388:8388/tcp"
      - "8080:8080"
      - "8081:8081"
      - "5000:5000"
      - "3000:3000"
      - "4000:4000"
      - "6000:6000"
      - "80:80"
      - "443:443"
    restart: always
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 20s
      timeout: 8s
      start_period: 45s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vpn-rotator:
    image: alpine:latest
    container_name: if-vpn-rotator
    volumes:
      - ./privacy-layer/vpn-rotator.sh:/vpn-rotator.sh:ro
      - ./shared-signals:/tmp/vpn-signals
    command: ["sh", "/vpn-rotator.sh"]
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    restart: always

  tor:
    build: ./privacy-layer/tor
    container_name: if-tor
    network_mode: "service:gluetun"
    volumes:
      - ./privacy-layer/tor/data:/var/lib/tor
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tor2:
    build: ./privacy-layer/tor2
    container_name: if-tor2
    network_mode: "service:gluetun"
    volumes:
      - ./privacy-layer/tor2/data:/var/lib/tor
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════
  # META-SEARCH ENGINES
  # ══════════════════════════════════════════════════════════════════

  searxng:
    container_name: if-searxng
    image: searxng/searxng:latest
    network_mode: "service:gluetun"
    environment:
      - GRANIAN_WORKERS=4
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./meta-search-engines/searxng/searxng:/etc/searxng:rw
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  searxng2:
    container_name: if-searxng2
    image: searxng/searxng:latest
    network_mode: "service:gluetun"
    environment:
      - GRANIAN_WORKERS=4
      - SEARXNG_PORT=8081
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./meta-search-engines/searxng/searxng2:/etc/searxng:rw
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  invidious-db:
    container_name: if-invidious-db
    image: postgres:14-alpine
    network_mode: "service:gluetun"
    restart: always
    environment:
      - POSTGRES_DB=invidious
      - POSTGRES_USER=kemal
      - POSTGRES_PASSWORD=kemal
    volumes:
      - invidious-db-data:/var/lib/postgresql/data

  invidious:
    container_name: if-invidious
    image: quay.io/invidious/invidious:latest
    network_mode: "service:gluetun"
    depends_on:
      - invidious-db
    environment:
      - INVIDIOUS_DATABASE_URL=postgres://kemal:kemal@localhost:5432/invidious
      - INVIDIOUS_HMAC_KEY=intentforge_v2_invidious_hmac_key_987654321
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════
  # INDEXER + CRAWLER
  # ══════════════════════════════════════════════════════════════════

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    container_name: if-indexer
    volumes:
      - ./indexer/index_data:/app/index_data
    network_mode: "service:gluetun"
    restart: always

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: if-crawler
    network_mode: "service:gluetun"
    restart: always

  # ══════════════════════════════════════════════════════════════════
  # INTENT ENGINE + GATEWAY
  # ══════════════════════════════════════════════════════════════════

  intent-engine:
    build:
      context: ./intent-engine
      dockerfile: Dockerfile
    container_name: if-intent-engine
    volumes:
      - ./intent-engine/models:/app/models
    environment:
      - RUST_LOG=info
      - RAYON_NUM_THREADS=4
    network_mode: "service:gluetun"
    restart: always

  geolite2-updater:
    build:
      context: ./geolite2-updater
      dockerfile: Dockerfile
    container_name: if-geolite2-updater
    environment:
      - MAXMIND_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
      - GATEWAY_CONTAINER_NAME=if-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - geolite2-data:/data
    restart: always

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: if-gateway
    environment:
      - INTENT_ENGINE_URL=http://localhost:3005
      - SEARXNG_URL=http://localhost:8080
      - SEARXNG2_URL=http://localhost:8081
      - CRAWLER_URL=http://localhost:5001
      - INDEXER_URL=http://localhost:6000
    volumes:
      - ./shared-signals:/tmp/vpn-signals
      - geolite2-data:/var/lib/geolite2:ro
    network_mode: "service:gluetun"
    depends_on:
      - intent-engine
      - crawler
      - indexer
      - searxng
      - searxng2
      - invidious
    restart: always

  # ══════════════════════════════════════════════════════════════════
  # REVERSE PROXY — Traefik (auto SSL via Let's Encrypt)
  # ══════════════════════════════════════════════════════════════════

  traefik:
    image: traefik:v3.1
    container_name: if-traefik
    network_mode: "service:gluetun"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/acme:/etc/traefik/acme
    depends_on:
      - gluetun
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  invidious-db-data:
  geolite2-data:
