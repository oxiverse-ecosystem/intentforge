name: goals-api-schema-tests

# Schema regression tests for the Goals API (round 2026-08-15T0326Z).
#
# RETIRED (2026-09-26) — merged into the `schema-regression` job in ci.yml.
#
# Both jobs below had the same defect that made the old ci.yml job worthless:
# they ran on a bare `ubuntu-latest` with no IntentForge stack, and the suites
# self-skipped when /health was unreachable. Both therefore reported `success`
# while executing ZERO assertions. The
# `secrets.INTENTFORGE_BASE_URL || 'http://localhost:4000'` fallback cannot
# rescue this — on a runner with no gateway, localhost:4000 is never reachable,
# so that expression is never satisfied in practice.
#
# The contract assertions now live in ONE place: the `schema-regression` job in
# ci.yml, which builds the real gateway image, runs it, waits for health, then
# runs `pytest tests/ -m "not requires_upstream"` with
# INTENTFORGE_REQUIRE_GATEWAY=1. That job also asserts a non-zero pass count, so
# it cannot conclude green while asserting nothing.
#
# Keeping a second, weaker copy of the same contract in a separate workflow is
# the "three overlapping suites, three sources of truth" trap: a fix landing in
# one file leaves the other silently unverified. One suite, one job, one signal.
#
# The needs-upstream tests this workflow used to pretend to run are exercised by
# the QA loop against the full local stack.

on:
  workflow_dispatch:

jobs:
  retired:
    name: "retired — contract regression now runs in ci.yml"
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "This workflow was retired. The API contract regression runs in"
          echo "ci.yml as the 'schema-regression' job, which brings up a real"
          echo "gateway and fails if the documented contract drifts."
          echo "See .github/workflows/ci.yml for the rationale."

# Historical body of the retired jobs, kept here as the record of what was
# replaced (do not restore — both were green no-ops):
#
#   goals-api-schema:  pytest tests/test_goals_api_schema.py -v
#   api-schema:        pytest tests/test_api_schema.py -v

