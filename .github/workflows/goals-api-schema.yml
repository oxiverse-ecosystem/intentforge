name: goals-api-schema-tests

# Schema regression tests for the Goals API + non-Goals endpoints.
# CRITICAL: this job must NEVER silently skip its purpose (green-wash).
# INTENTFORGE_REQUIRE_GATEWAY=1 makes an unreachable gateway a HARD FAIL,
# so a broken stack or a missing gateway turns the check RED.

on:
  push:
    branches: [master, main, 'auto/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: goals-api-schema-${{ github.ref }}
  cancel-in-progress: true

env:
  INTENTFORGE_REQUIRE_GATEWAY: "1"

jobs:
  schema-regression:
    name: API schema regression (live gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Build gateway image (CI compose — no VPN)
        run: cd services && docker compose -f docker-compose.ci.yml build gateway

      - name: Bring up gateway stack
        run: cd services && docker compose -f docker-compose.ci.yml up -d

      - name: Wait for gateway health
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/health 2>/dev/null | grep -q OK; then
              echo "Gateway healthy"
              exit 0
            fi
            echo "Waiting for gateway... ($i/60)"
            sleep 2
          done
          echo "Gateway never became healthy"
          docker compose -f services/docker-compose.ci.yml logs gateway --tail 50 || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install -r requirements-tests.txt

      - name: Run schema tests (collectable by directory, REQUIRE=1 → FAIL if down)
        env:
          INTENTFORGE_REQUIRE_GATEWAY: "1"
          INTENTFORGE_BASE_URL: "http://localhost:4000"
        run: pytest tests/ -v
