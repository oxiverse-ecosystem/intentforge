name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, 'auto/round-**']

# A new push to the same ref cancels the previous, still-running run. Under the
# autonomous QA loop this repo is pushed to many times per day; cancelling
# superseded runs avoids burning Actions compute + network egress on stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gateway-tests:
    name: gateway unit tests (pure logic, no Docker)
    runs-on: ubuntu-latest
    # Only the gateway crate has real unit tests (clean.rs, spell.rs, main.rs).
    # We deliberately DO NOT build the full Rust+Docker stack here — that would
    # burn 10-20 min of Actions compute for no signal. The gateway tests cover
    # the pure ranking/cleaning/spell-correction logic that actually regresses.
    steps:
      - uses: actions/checkout@v4
        with:
          # Defense-in-depth: never pull Git-LFS objects in CI. This repo has no
          # LFS-tracked files today, but if a future commit re-tracks one, a deep
          # checkout would silently re-serve it and burn the LFS bandwidth quota.
          # A shallow clone also cuts per-run checkout egress + wall-clock.
          lfs: false
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/gateway/target
          key: ${{ runner.os }}-cargo-gateway-${{ hashFiles('services/gateway/Cargo.lock', 'services/gateway/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gateway-

      - name: Build gateway tests (compile only)
        working-directory: services/gateway
        run: cargo test --no-run --locked

      - name: Run gateway unit tests
        working-directory: services/gateway
        run: cargo test --locked

  # NOTE: API schema regression (live-gateway contract) is owned by
  # .github/workflows/goals-api-schema.yml, which runs the SAME suites
  # (tests/goals_api_schema.py + tests/test_api_schema.py) and is driven by the
  # QA loop. Running it again here would be duplicate compute + egress on every
  # push, so it is intentionally not duplicated in this file.
