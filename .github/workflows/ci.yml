name: ci

on:
  push:
    branches: [master, main, 'auto/**']
  pull_request:
    branches: [master, main, 'auto/round-**']

env:
  CARGO_TERM_COLOR: always

jobs:
  gateway-tests:
    name: gateway unit tests (pure logic, no Docker)
    runs-on: ubuntu-latest
    # Only the gateway crate has real unit tests (clean.rs, spell.rs, main.rs).
    # We deliberately DO NOT build the full Rust+Docker stack here — that would
    # burn 10-20 min of Actions compute for no signal. The gateway tests cover
    # the pure ranking/cleaning/spell-correction logic that actually regresses.
    steps:
      - uses: actions/checkout@v4
        with:
          # Defense-in-depth: never pull Git-LFS objects in CI. This repo has no
          # LFS-tracked files today, but if a future commit re-tracks one, a deep
          # checkout would silently re-serve it and burn the LFS bandwidth quota.
          # A shallow clone also cuts per-run checkout egress + wall-clock.
          lfs: false
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/gateway/target
          key: ${{ runner.os }}-cargo-gateway-${{ hashFiles('services/gateway/Cargo.lock', 'services/gateway/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gateway-

      - name: Build gateway tests (compile only)
        working-directory: services/gateway
        run: cargo test --no-run --locked

      - name: Run gateway unit tests
        working-directory: services/gateway
        run: cargo test --locked

      # RESTORED (was lost when the round branch's ci.yml was overwritten by
      # 00f6a1f): the no-manipulation guarantee is only real if the
      # order-invariance tests actually RUN. This repo has twice reported a
      # green build while those tests were absent from the branch, and the
      # price-honesty guard (card t_6be23d48) is worthless if a future edit
      # renames or drops the tests that prove it.
      #
      # `if: always()`, NOT the default `success()`: the step is skipped
      # whenever the step before it fails, and the failure that matters here is
      # exactly a red suite. A guard that only speaks up on green is no guard.
      - name: Assert the order-invariance + price-honesty guards actually ran
        if: always()
        working-directory: services/gateway
        run: |
          set -euo pipefail
          log=$(mktemp)
          { cargo test --locked real_data_ 2>&1 || true; } | tee "$log"

          missing=0
          for t in \
            real_data_order_is_invariant_for_every_network_key_on_and_off \
            real_data_whole_config_order_invariant_keys_present_vs_absent \
            real_data_broad_queries_never_decorate_and_never_reorder \
            real_data_model_shape_accepts_models_and_rejects_non_model_numbers
          do
            if ! grep -q "$t" "$log"; then
              echo "::error::order-invariance test '$t' did not run — the no-reorder guarantee is UNENFORCED on this branch"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # A zero-match run is a vacuous pass, not a pass.
          ran=$(grep -cE '^test real_data_.* \.\.\. ok$' "$log" || true)
          if [ "$ran" -lt 4 ]; then
            echo "::error::expected 4 real_data_ tests to pass, saw ${ran} — the commerce config is probably empty and the comparison is vacuous"
            exit 1
          fi
          echo "order-invariance guard: ${ran}/4 tests executed and passed"

          # The price-honesty contract (card t_6be23d48): the gateway must never
          # serve a top-level price that its own page extraction did not verify.
          log2=$(mktemp)
          { cargo test --locked commerce_contract_tests:: 2>&1 || true; } | tee "$log2"
          honesty_missing=0
          for t in \
            unverified_index_price_is_not_serialised \
            verified_page_price_replaces_conflicting_index_price \
            kept_price_always_carries_an_observation_timestamp \
            price_range_never_collapses_to_a_single_top_level_price \
            reconcile_never_reorders_or_drops_results \
            shopping_enrichment_nulls_the_unverified_stale_price \
            shopping_enrichment_serves_the_page_price_when_the_fetch_succeeds
          do
            if ! grep -qE "^test commerce_contract_tests::${t} \.\.\. ok$" "$log2"; then
              echo "::error::price-honesty test '$t' did not PASS — an unverified crawl-index price can be served as a page fact"
              honesty_missing=1
            fi
          done
          [ "$honesty_missing" -eq 0 ] || exit 1
          echo "price-honesty guard: 7/7 tests executed and passed"

  schema-regression:
    name: API schema regression (live gateway contract)
    runs-on: ubuntu-latest
    # This job asserts the documented JSON contracts for EVERY endpoint in
    # API_REFERENCE.md (incl. the Goals API). It needs a RUNNING gateway.
    #
    # IMPORTANT: a bare runner has no IntentForge stack, so the suite is designed
    # to SKIP cleanly there (no green-washing of a real failure). To make it a
    # real guard, bring the stack up (docker compose) and set
    # INTENTFORGE_REQUIRE_GATEWAY=1 so an unreachable/contract-drifted gateway
    # FAILS the run. The QA loop already does this locally/where the stack runs.
    #
    # Example (when the stack is brought up in this job):
    #   - name: Bring up IntentForge stack
    #     run: (cd services && docker compose -f docker-compose.dev.yml up -d gateway indexer ...)
    #   - name: Wait for gateway health
    #     run: for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 5; done
    #   - name: Run schema regression (must fail if gateway missing)
    #     env:
    #       INTENTFORGE_BASE: http://localhost:4000
    #       INTENTFORGE_REQUIRE_GATEWAY: "1"
    #     run: pytest tests/goals_api_schema.py -v
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install -r tests/requirements.txt

      - name: Check gateway reachability
        id: gateway-check
        env:
          INTENTFORGE_BASE: http://localhost:4000
        run: |
          echo "Checking gateway reachability at $INTENTFORGE_BASE..."
          if curl -sf --max-time 5 "$INTENTFORGE_BASE/health" > /dev/null 2>&1; then
            echo "gateway_reachable=true" >> "$GITHUB_OUTPUT"
            echo "Gateway is UP — schema regression will run as a real guard."
          else
            echo "gateway_reachable=false" >> "$GITHUB_OUTPUT"
            echo "Gateway at $INTENTFORGE_BASE is NOT reachable."
            echo "schema-regression skipped (no live gateway). The Rust unit tests"
            echo "(gateway-tests job) cover pure logic. Live-API schema tests are the"
            echo "QA loop's responsibility (runs where the stack exists)."
          fi

      - name: Run API schema regression
        if: steps.gateway-check.outputs.gateway_reachable == 'true'
        env:
          # Only reached when gateway is reachable — now REQUIRE it (fail if down).
          INTENTFORGE_REQUIRE_GATEWAY: "1"
          INTENTFORGE_BASE: http://localhost:4000
        run: pytest tests/goals_api_schema.py -v

      - name: Report schema-regression skip
        if: steps.gateway-check.outputs.gateway_reachable == 'false'
        run: |
          echo "::warning::schema-regression SKIPPED — no live gateway at $INTENTFORGE_BASE"
          echo "::warning::This job is a no-op on a bare runner. The QA loop runs"
          echo "::warning::the suite where the stack exists."
