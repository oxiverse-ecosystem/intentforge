name: ci

on:
  push:
    branches: [master, main, 'auto/**']
  pull_request:
    branches: [master, main, 'auto/round-**']

env:
  CARGO_TERM_COLOR: always

jobs:
  gateway-tests:
    name: gateway unit tests (pure logic, no Docker)
    runs-on: ubuntu-latest
    # Only the gateway crate has real unit tests (clean.rs, spell.rs, main.rs).
    # We deliberately DO NOT build the full Rust+Docker stack here — that would
    # burn 10-20 min of Actions compute for no signal. The gateway tests cover
    # the pure ranking/cleaning/spell-correction logic that actually regresses.
    steps:
      - uses: actions/checkout@v4
        with:
          # Defense-in-depth: never pull Git-LFS objects in CI. This repo has no
          # LFS-tracked files today, but if a future commit re-tracks one, a deep
          # checkout would silently re-serve it and burn the LFS bandwidth quota.
          # A shallow clone also cuts per-run checkout egress + wall-clock.
          lfs: false
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/gateway/target
          key: ${{ runner.os }}-cargo-gateway-${{ hashFiles('services/gateway/Cargo.lock', 'services/gateway/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gateway-

      - name: Build gateway tests (compile only)
        working-directory: services/gateway
        run: cargo test --no-run --locked

      - name: Run gateway unit tests
        working-directory: services/gateway
        run: cargo test --locked

  schema-regression:
    name: API schema regression (live gateway contract)
    runs-on: ubuntu-latest
    # This job asserts the documented JSON contracts for EVERY endpoint in
    # API_REFERENCE.md (incl. the Goals API). It needs a RUNNING gateway.
    #
    # FIX-6: previously INTENTFORGE_REQUIRE_GATEWAY was "0", so on a bare runner
    # the entire suite skipped (15 skipped in 0.10s) and CI was green while
    # asserting nothing. Now set to "1" and bring the stack up — an
    # unreachable/contract-drifted gateway FAILS the run. No more green-washing.
    #
    # The full stack needs VPN creds (gluetun -> ../.env) which are NOT available
    # in CI, so docker compose will fail to bring up gluetun-dependent services.
    # That is CORRECT: CI goes RED, not green-washed. The QA loop runs these
    # tests locally where the real stack is up.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: pip install -r tests/requirements.txt

      - name: Bring up IntentForge stack
        run: |
          cd services
          docker compose -f docker-compose.dev.yml up -d --build 2>&1 || true
          echo "--- stack status ---"
          docker compose -f docker-compose.dev.yml ps 2>&1 || true

      - name: Wait for gateway health (fail fast if stack is down)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health >/dev/null 2>&1; then
              echo "Gateway healthy after ${i} attempts"
              exit 0
            fi
            echo "Attempt $i: gateway not ready, waiting 5s..."
            sleep 5
          done
          echo "ERROR: gateway never became healthy"
          exit 1

      - name: Run API schema regression (must fail if gateway missing)
        env:
          INTENTFORGE_REQUIRE_GATEWAY: "1"
          INTENTFORGE_BASE: http://localhost:4000
        run: pytest tests/goals_api_schema.py -v"
