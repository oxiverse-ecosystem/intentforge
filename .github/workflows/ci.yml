name: ci

on:
  push:
    branches: [master, main, 'auto/**']
  pull_request:
    branches: [master, main, 'auto/round-**']

env:
  CARGO_TERM_COLOR: always

jobs:
  gateway-tests:
    name: gateway unit tests (pure logic, no Docker)
    runs-on: ubuntu-latest
    # Only the gateway crate has real unit tests (clean.rs, spell.rs, main.rs).
    # We deliberately DO NOT build the full Rust+Docker stack here — that would
    # burn 10-20 min of Actions compute for no signal. The gateway tests cover
    # the pure ranking/cleaning/spell-correction logic that actually regresses.
    steps:
      - uses: actions/checkout@v4
        with:
          # Defense-in-depth: never pull Git-LFS objects in CI. This repo has no
          # LFS-tracked files today, but if a future commit re-tracks one, a deep
          # checkout would silently re-serve it and burn the LFS bandwidth quota.
          # A shallow clone also cuts per-run checkout egress + wall-clock.
          lfs: false
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/gateway/target
          key: ${{ runner.os }}-cargo-gateway-${{ hashFiles('services/gateway/Cargo.lock', 'services/gateway/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gateway-

      - name: Build gateway tests (compile only)
        working-directory: services/gateway
        run: cargo test --no-run --locked

      - name: Run gateway unit tests
        working-directory: services/gateway
        run: cargo test --locked

      # The no-manipulation guarantee ("affiliate links, no search manipulation")
      # is only real if the order-invariance tests actually RUN. This repo has
      # twice reported a green build while those tests were absent from the
      # branch entirely, and once more while they ran against an empty affiliate
      # config — both times concluding "order invariance holds" having compared
      # two no-op runs. A green `cargo test` alone cannot distinguish that from a
      # real pass, so assert the test NAMES are in the log, the same way the
      # schema-regression job asserts a non-zero executed count.
      - name: Assert the order-invariance guard actually ran
        # `always()`, NOT the default `success()`: this step is skipped whenever
        # the step before it fails, and the failure that matters here is exactly
        # a red suite. A guard that only speaks up on green is no guard — it
        # would stay silent through every regression it exists to catch, and
        # silently-skipped is the failure mode this whole card is about.
        if: always()
        working-directory: services/gateway
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo test --locked real_data_ 2>&1 | tee "$log"

          missing=0
          for t in \
            real_data_order_is_invariant_for_every_network_key_on_and_off \
            real_data_whole_config_order_invariant_keys_present_vs_absent \
            real_data_decoration_touches_no_field_except_affiliate \
            main_path_enrichment_is_non_vacuous_with_fetchable_pages
          do
            if ! grep -q "$t" "$log"; then
              echo "::error::order-invariance test '$t' did not run — the no-reorder guarantee is UNENFORCED on this branch"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # A zero-match run is a vacuous pass, not a pass.
          ran=$(grep -cE '^test real_data_.* \.\.\. ok$' "$log" || true)
          if [ "$ran" -lt 4 ]; then
            echo "::error::expected 4 real_data_ tests to pass, saw ${ran} — the commerce config is probably empty and the comparison is vacuous"
            exit 1
          fi
          echo "order-invariance guard: ${ran}/4 tests executed and passed"

  schema-regression:
    name: API contract regression (real gateway in CI)
    runs-on: ubuntu-latest
    # This job is a REAL GUARD. It builds the gateway image, runs it, and
    # asserts the documented JSON contract of every endpoint against it.
    #
    # It used to be a guaranteed-green no-op: it probed localhost:4000 on a
    # bare runner (always unreachable), gated the run step behind that probe,
    # and concluded `success` having asserted nothing. Three defects are fixed
    # here, and each one is load-bearing:
    #
    #   1. The job brings up its own gateway, so there is no reachability
    #      branch to fall through. There is no `if:` on the test step and no
    #      "skipped, sorry" path — a dead gateway is a hard failure.
    #   2. Collection is BY DIRECTORY over the whole tests/ tree. The old job
    #      pinned `pytest tests/goals_api_schema.py`, and because that file had
    #      no `test_` prefix, directory collection silently MISSED it — those
    #      assertions were invisible to every run. It is now
    #      tests/test_goals_api_schema.py, and a gate fails the job if ANY file
    #      in tests/ ever loses the prefix again.
    #   3. A non-vacuity check runs afterwards and fails the job if too few
    #      tests pass. A green conclusion with no executed assertions is no
    #      longer expressible.
    #
    # `-m "not requires_upstream"` excludes the handful of tests that need a
    # live SearXNG result set (non-deterministic, third-party, and would make
    # CI flaky). They are still run by the QA loop against the full stack.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tests.txt

      - name: Build gateway image
        run: docker build -t intentforge-gateway:ci services/gateway

      - name: Start gateway
        run: |
          docker run -d --name if-ci-gateway -p 4000:4000 \
            -e RUST_LOG=info \
            intentforge-gateway:ci

      - name: Wait for gateway health (fail if it never comes up)
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 http://localhost:4000/health >/dev/null 2>&1; then
              ok=1; echo "gateway healthy after ${i} attempt(s)"; break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::gateway never became healthy; container log follows"
            docker logs if-ci-gateway
            exit 1
          fi

      - name: Assert collection is non-vacuous
        # Catches the exact class of defect this job was created to kill: a
        # renamed/moved/prefix-stripped file that silently drops out of
        # collection, leaving the suite green because nothing ran.
        #
        # The logic lives in scripts/ci-assert-collection.sh, NOT inline here,
        # so that scripts/_ci_guard_selftest.sh can break the tree on purpose
        # and prove this gate goes RED. A copy of the logic inside the workflow
        # could only be verified by pushing a branch and burning a CI run,
        # which is precisely why the original version was never checked.
        run: bash scripts/ci-assert-collection.sh

      - name: Run API contract regression
        env:
          # REQUIRED, not optional: the gateway is up (previous step proved it),
          # so an unreachable gateway here is a real failure and must not skip.
          INTENTFORGE_REQUIRE_GATEWAY: "1"
          INTENTFORGE_BASE: http://localhost:4000
          INTENTFORGE_BASE_URL: http://localhost:4000
        run: pytest tests/ -m "not requires_upstream" -v -rs

      - name: Assert the run was non-vacuous
        # Final gate: a `success` conclusion must imply real assertions ran.
        # Also a script (scripts/ci-assert-run-non-vacuous.sh) for the same
        # reason: it compares the passed count against the SAME CONTRACT floor
        # gate 1 verified is selectable, so the two gates cannot drift into
        # disagreeing about what "enough" means, and it catches what gate 1
        # cannot see — a blanket skip added to a fixture, or a gateway that
        # answers 200 on /health but not on the endpoints.
        run: bash scripts/ci-assert-run-non-vacuous.sh

      - name: Gateway logs on failure
        if: failure()
        run: docker logs if-ci-gateway
